# 분야: 보안 — 실제로 받아지는 것을 확인한 출처 (2026-11-13 test-source 통과)
# 형식은 ai.yaml 머리말 참고. 공공기관 보도자료(KISA 보호나라 등)는 RSS가 없어 아직 없음

feeds:
  - {id: boannews, name: 보안뉴스, url: "https://cdn.boannews.com/rss/gn_rss_allArticle.xml", tier: 1, max: 10, tags: [언론, 국내], desc: "국내 보안 사고·정책 소식이 가장 빨리 모이는 곳"}
  - {id: dailysecu, name: 데일리시큐, url: "https://www.dailysecu.com/rss/allArticle.xml", tier: 2, max: 8, tags: [언론, 국내], desc: "국내 보안 업계·사고 소식"}
  - {id: bleepingcomputer, name: BleepingComputer, url: "https://www.bleepingcomputer.com/feed/", tier: 1, tags: [언론, 해외], desc: "랜섬웨어·취약점 속보"}
  - {id: thehackernews, name: The Hacker News, url: "https://feeds.feedburner.com/TheHackersNews", tier: 2, tags: [언론, 해외], desc: "취약점·공격 기법 소식"}
  - {id: krebsonsecurity, name: KrebsOnSecurity, url: "https://krebsonsecurity.com/feed/", tier: 2, tags: [전문가, 해외], desc: "대형 사고의 뒷이야기를 깊게 다룸"}
  - {id: schneier, name: Schneier on Security, url: "https://www.schneier.com/feed/atom/", tier: 3, tags: [전문가, 해외], desc: "보안 정책·흐름에 대한 전문가 시각"}
  - {id: microsoft-security-blog, name: Microsoft 보안 블로그, url: "https://www.microsoft.com/en-us/security/blog/feed/", org: Microsoft, tier: 1, tags: [회사 블로그, 해외], desc: "윈도우·클라우드 보안 공식 발표"}
  - {id: cisa-advisories, name: CISA 보안 권고, url: "https://www.cisa.gov/cybersecurity-advisories/all.xml", org: CISA, tier: 2, max: 5, tags: [공공기관, 해외], desc: "미국 정부의 긴급 취약점 권고 (글이 많아 하루 5건)"}
  - {id: project-zero, name: Google Project Zero, url: "https://projectzero.google/feed.xml", org: Google, tier: 3, tags: [연구, 해외], desc: "제로데이 분석의 1차 자료 (글이 드묾)"}

pages: []

news:
  - {id: news-sec-ransomware-ko, q: "랜섬웨어 공격", must: "랜섬웨어", lang: ko, tier: 2, tags: [국내], desc: "국내 랜섬웨어 기사"}
  - {id: news-sec-breach-ko, q: "개인정보 유출 해킹", must: "유출|해킹", lang: ko, tier: 2, tags: [국내], desc: "국내 해킹·유출 사고 기사"}
  - {id: news-sec-zerotrust-ko, q: "제로트러스트 보안", must: "제로트러스트|제로 트러스트", lang: ko, tier: 2, tags: [국내], desc: "제로트러스트 도입 기사"}
  - {id: news-sec-kisa, q: "KISA 보안", must: "KISA|인터넷진흥원", org: KISA, lang: ko, tier: 1, tags: [공공기관, 국내], desc: "한국인터넷진흥원 기사 (보호나라는 RSS가 없음)"}
  - {id: news-sec-fsec, q: "금융보안원", must: "금융보안원", org: 금융보안원, lang: ko, tier: 1, tags: [공공기관, 금융, 국내], desc: "금융보안원 기사"}
  - {id: news-sec-zeroday-en, q: "zero-day vulnerability exploited", must: "zero-day|0-day|exploit", lang: en, tier: 2, tags: [해외], desc: "해외 제로데이 기사"}
  - {id: news-sec-ransomware-en, q: "ransomware attack", must: "ransomware", lang: en, tier: 2, tags: [해외], desc: "해외 랜섬웨어 기사"}
  - {id: news-sec-breach-en, q: "data breach", must: "breach", lang: en, tier: 3, tags: [해외], desc: "해외 유출 사고 기사"}
