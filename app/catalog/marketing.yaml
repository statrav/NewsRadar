  - {id: news-mkt-shortform, q: "숏폼 마케팅", must: "숏폼|릴스|쇼츠", lang: ko, tier: 2, tags: [SNS, 국내], desc: "숏폼 마케팅 기사"}
  - {id: news-mkt-campaign, q: "브랜드 캠페인 SNS", must: "캠페인|SNS", lang: ko, tier: 2, tags: [국내], desc: "브랜드 캠페인 사례"}
  - {id: news-mkt-meta-ko, q: "메타 인스타그램 광고", must: "메타|인스타그램|Meta", org: Meta, lang: ko, tier: 1, tags: [플랫폼, 국내], desc: "메타 광고 기사"}
  - {id: news-mkt-google-ko, q: "구글 유튜브 광고", must: "구글|유튜브", org: Google, lang: ko, tier: 1, tags: [플랫폼, 국내], desc: "구글·유튜브 광고 기사"}
  - {id: news-mkt-naver, q: "네이버 광고", must: "네이버", org: 네이버, lang: ko, tier: 1, tags: [플랫폼, 국내], desc: "네이버 광고 기사"}
  - {id: news-mkt-kakao, q: "카카오 광고 비즈니스", must: "카카오", org: 카카오, lang: ko, tier: 1, tags: [플랫폼, 국내], desc: "카카오 광고 기사"}
  - {id: news-mkt-adtech-en, q: "digital advertising", must: "advertising|ads", lang: en, tier: 2, tags: [해외], desc: "해외 디지털 광고 업계"}
  - {id: news-mkt-tiktok-en, q: "TikTok ads marketers", must: "TikTok", lang: en, tier: 2, tags: [플랫폼, 해외], desc: "틱톡 광고 기사"}
