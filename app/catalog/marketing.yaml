# 분야: 디지털 마케팅 — 실제로 받아지는 것을 확인한 출처 (2026-11-13 test-source 통과)
# 형식은 ai.yaml 머리말 참고. Search Engine Land는 자동 접근을 막음(403), 국내 마케팅 전문 사이트는 RSS를 못 찾아 아직 없음

feeds:
  - {id: socialmediatoday, name: Social Media Today, url: "https://www.socialmediatoday.com/feeds/news/", tier: 1, tags: [언론, SNS, 해외], desc: "SNS 플랫폼 기능·정책 변경"}
  - {id: marketingweek, name: Marketing Week, url: "https://www.marketingweek.com/feed/", tier: 2, max: 6, tags: [언론, 브랜드, 해외], desc: "브랜드 마케팅 업계 흐름"}
  - {id: meta-newsroom, name: Meta 뉴스룸, url: "https://about.fb.com/news/feed/", org: Meta, tier: 1, filter: true, tags: [회사 발표, 해외], desc: "페이스북·인스타그램 공식 발표 (분야 글만 거름)"}
  - {id: hubspot-marketing, name: HubSpot 마케팅 블로그, url: "https://blog.hubspot.com/marketing/rss.xml", org: HubSpot, tier: 3, max: 3, tags: [실무, 해외], desc: "실무 마케팅 방법 (글이 많아 하루 3건)"}
  - {id: moz-blog, name: Moz 블로그, url: "https://moz.com/posts/rss/blog", org: Moz, tier: 3, tags: [SEO, 해외], desc: "검색 최적화 실무"}

pages: []

news:
